name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (core, API, browser UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cryptography playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/run_all.py --quick

  android:
    name: Android (compatibility, app tests, build)
    runs-on: ubuntu-latest   # the Android SDK is preinstalled on GitHub's runners ($ANDROID_HOME)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"   # android/core uses a Java 21 toolchain
      - run: pip install cryptography
      - name: Python <-> Kotlin format compatibility
        run: |
          python tests/make_compat_vault.py /tmp/compat1
          (cd android && ./gradlew :core:test --rerun -Ddv.testdir=/tmp/compat1 --no-daemon)
          python tests/check_compat_vault.py /tmp/compat1 "kotlin pass 2"
      - name: Android app tests
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon
